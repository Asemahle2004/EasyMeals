name: Build HomeGuard ESP v1.2 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble Android source
        run: |
          cat homeguard_source.part1 homeguard_source.part2 homeguard_source.part3 homeguard_source.part4 > homeguard_source.b64
          base64 -d homeguard_source.b64 > homeguard_source.zip
          mkdir -p buildsrc
          unzip -q homeguard_source.zip -d buildsrc

      - name: Apply v1.1 MQTT diagnostics base
        run: |
          cat homeguard_v11_index.part1 homeguard_v11_index.part2 homeguard_v11_index.part3 homeguard_v11_index.part4 > homeguard_v11_index.gz.b64
          base64 -d homeguard_v11_index.gz.b64 | gunzip > buildsrc/app/src/main/assets/index.html

      - name: Apply v1.2 two-way controls and vibration
        run: |
          python homeguard_v12_patch.py
          grep -q "VIBRATION / TAMPER" buildsrc/app/src/main/assets/index.html
          grep -q "SILENCE_ALARM" buildsrc/app/src/main/assets/index.html
          grep -q "home/security/status" buildsrc/app/src/main/assets/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp buildsrc/app/build/outputs/apk/debug/app-debug.apk HomeGuardESP-v1.2.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeGuardESP-v1.2
          path: HomeGuardESP-v1.2.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view homeguard-esp-v1.2.0 >/dev/null 2>&1; then
            gh release upload homeguard-esp-v1.2.0 HomeGuardESP-v1.2.apk --clobber
          else
            gh release create homeguard-esp-v1.2.0 HomeGuardESP-v1.2.apk \
              --title "HomeGuard ESP v1.2" \
              --notes "Adds two-way ESP32 control, remote arm/disarm, immediate alarm silence, panic alarm, device status sync, and dedicated vibration/tamper alerts."
          fi
